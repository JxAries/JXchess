<!DOCTYPE html>
<!-- 摆棋页：棋盘居中，右侧为选子面板与操作栏；支持选择/擦除/放置、拖拽、先手与易位权利。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>摆棋 · JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
</head>
<body class="page">
  <header class="topbar">
    <a class="brand" href="./index.html">
      <img src="./logo.svg" alt="JXchess" />
      <span>JXchess</span>
    </a>
    <nav class="page-nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link" href="./review.html">复盘</a>
      <a class="nav-link active" href="./editor.html">摆棋</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <main class="main">
    <div class="board-stage">
      <div class="board-wrap" id="board-wrap"></div>
    </div>

    <aside class="side">
      <div class="panel palette">
        <div class="panel-head">棋子</div>
        <div class="tool-row">
          <button id="btn-select" class="btn mode selected" type="button" title="点击棋盘上的棋子可拿起并放到其它格子">选择</button>
          <button id="tool-erase" class="btn mode" type="button" title="点击棋盘上的棋子将其移除">擦除</button>
        </div>
        <div class="palette-row" id="palette-white"></div>
        <div class="palette-row" id="palette-black"></div>
      </div>

      <div class="panel tools">
        <div class="panel-head">操作</div>
        <div class="tool-grid">
          <button id="btn-classic" class="btn" type="button">初始局面</button>
          <button id="btn-clear" class="btn" type="button">清空</button>
          <button id="btn-load" class="btn" type="button">载入 FEN</button>
          <button id="btn-copy" class="btn" type="button">复制 FEN</button>
        </div>

        <div class="opt-group">
          <div class="opt-label">先手</div>
          <div class="opt-row">
            <button id="btn-turn-w" class="btn opt-chip selected" type="button">白先</button>
            <button id="btn-turn-b" class="btn opt-chip" type="button">黑先</button>
          </div>
        </div>

        <div class="opt-group">
          <div class="opt-label">易位权利</div>
          <div class="opt-row four">
            <button id="ck-wk" class="btn opt-chip selected" type="button" title="白方短易位">白 O-O</button>
            <button id="ck-wq" class="btn opt-chip selected" type="button" title="白方长易位">白 O-O-O</button>
            <button id="ck-bk" class="btn opt-chip selected" type="button" title="黑方短易位">黑 O-O</button>
            <button id="ck-bq" class="btn opt-chip selected" type="button" title="黑方长易位">黑 O-O-O</button>
          </div>
        </div>

        <div class="opt-group">
          <div class="opt-row">
            <button id="btn-flip" class="btn" type="button">翻转棋盘</button>
          </div>
        </div>

        <div class="opt-group">
          <button id="btn-review" class="btn primary block" type="button">带此局面去复盘</button>
          <p class="king-note" id="king-note"></p>
        </div>
      </div>
    </aside>
  </main>

  <script>
    /* 提示：直接双击打开本文件时工程无法运行，需先通过 npm run dev 启动本地服务。 */
    if (location.protocol === 'file:') {
      var tip = document.createElement('div');
      tip.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#8a4b2f;color:#fff;padding:10px 18px;text-align:center;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;';
      tip.textContent = '直接双击 HTML 无法运行本工程。请在 v0.1 目录执行 npm install 后运行 npm run dev，再用浏览器访问 http://localhost:5173/editor.html';
      document.body.appendChild(tip);
    }
  </script>
  <script type="module" src="./src/pages/editor.ts"></script>
</body>
</html>
