<!DOCTYPE html>
<!-- 首页：logo 居中，标题在下，入口按钮分列两侧；背景棋子由脚本随机生成并缓缓飘落，鼠标为棋子跟随效果。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page home">
  <!-- 飘落的棋子背景由 home.ts 随机生成，纯装饰 -->
  <div class="sky" aria-hidden="true"></div>

  <main class="home-stage">
    <a class="entry flank left" href="./review.html">
      <img src="./pieces/wK.svg" alt="" width="46" height="46" draggable="false" />
      <span class="entry-name">复盘</span>
      <span class="entry-desc">导入棋谱，逐步回放</span>
    </a>

    <div class="home-center">
      <div class="home-logo"><img src="./logo.svg" alt="JXchess logo" width="150" height="150" draggable="false" /></div>
      <h1 class="home-title">JXchess</h1>
      <p class="home-sub">开源免费的国际象棋工具</p>
    </div>

    <a class="entry flank right" href="./editor.html">
      <img src="./pieces/wB.svg" alt="" width="46" height="46" draggable="false" />
      <span class="entry-name">摆棋</span>
      <span class="entry-desc">自由摆放，研究局面</span>
    </a>
  </main>

  <script>
    /* 提示：直接双击打开本文件时工程无法运行，需先通过 npm run dev 启动本地服务。 */
    if (location.protocol === 'file:') {
      var tip = document.createElement('div');
      tip.className = 'file-warning';
      tip.textContent = '直接双击 HTML 无法运行本工程。请在 v0.1 目录执行 npm install 后运行 npm run dev，再用浏览器访问 http://localhost:5173/';
      document.body.appendChild(tip);
    }
  </script>
  <script type="module" src="./src/pages/home.ts"></script>
</body>
</html>
