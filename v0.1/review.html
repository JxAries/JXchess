<!DOCTYPE html>
<!-- 复盘页：棋盘居中，右侧棋谱面板；播放控制与导入导出都在面板内，棋盘下方不再留控制条。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复盘 · JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page review">
  <header class="topbar">
    <div class="brand">
      <img src="./logo.svg" alt="JXchess" width="30" height="30" />
      <span>JXchess</span>
    </div>
    <nav class="page-nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link active" href="./review.html">复盘</a>
      <a class="nav-link" href="./editor.html">摆棋</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <main class="main">
    <div class="board-stage">
      <div class="board-wrap" id="board-wrap"></div>
    </div>

    <aside class="side">
      <div class="panel movepanel">
        <div class="panel-head">棋谱</div>
        <div class="panel-tools">
          <input id="file-picker" type="file" accept=".pgn,.txt,application/x-chess-pgn" hidden />
          <button id="btn-open-file" class="btn" type="button" title="从本机选择 PGN 文件">打开文件</button>
          <button id="btn-import" class="btn" type="button" title="粘贴 PGN 文本">粘贴棋谱</button>
          <button id="btn-export" class="btn" type="button" title="导出当前对局为 PGN 文件">导出 PGN</button>
          <button id="btn-flip" class="btn" type="button" title="翻转棋盘">翻转棋盘</button>
          <button id="btn-new-branch" class="btn" type="button" title="在当前位置新建一条支线，接着走一步即进入该支线">新建分支</button>
          <button id="btn-delete-branch" class="btn" type="button" title="删除当前所在的支线">删除分支</button>
        </div>
        <!-- 播放控制：紧跟在按钮组下方、得子行上方，不再单独占棋盘下的一行 -->
        <div class="ctlbar" id="ctlbar">
          <button id="btn-start" class="ctl" type="button" title="回到开局">⏮</button>
          <button id="btn-prev" class="ctl" type="button" title="上一步">◀</button>
          <button id="btn-next" class="ctl" type="button" title="下一步">▶</button>
          <button id="btn-end" class="ctl" type="button" title="跳到终局">⏭</button>
        </div>
        <p class="panel-note" id="panel-note"></p>
        <div class="cap-row" id="cap-white" title="白方得子"></div>
        <div class="cap-row" id="cap-black" title="黑方得子"></div>
        <div class="move-list" id="move-list"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="./src/pages/review.ts"></script>
</body>
</html>
