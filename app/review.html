<!DOCTYPE html>
<!-- 复盘页：左侧分析面板、中间棋盘（右侧评估条、上下得子）、右侧棋谱面板。
     窄屏（<1180px）时左面板收进抽屉，点顶栏「分析」展开。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复盘 · JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page review">
  <header class="topbar">
    <div class="brand">
      <img src="./logo.svg" alt="JXchess" width="30" height="30" />
      <span>JXchess</span>
    </div>
    <nav class="page-nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link active" href="./review.html">复盘</a>
      <a class="nav-link" href="./editor.html">摆棋</a>
    </nav>
    <div class="spacer"></div>
    <button id="btn-analysis-drawer" class="btn drawer-toggle" type="button" title="展开分析面板">分析</button>
  </header>

  <main class="main review-main" id="review-main">
    <!-- 左侧：分析面板 -->
    <aside class="side side-left" id="side-left">
      <div class="panel analysis-panel">
        <div class="panel-head">分析</div>

        <div class="analysis-body" id="analysis-body">
          <!-- 引擎一选 / 二选 -->
          <div class="engine-lines">
            <div class="engine-line">
              <span class="engine-rank">1</span>
              <span class="engine-score" id="engine-score-1">—</span>
              <span class="engine-pv" id="engine-pv-1">未分析</span>
            </div>
            <div class="engine-line">
              <span class="engine-rank">2</span>
              <span class="engine-score" id="engine-score-2">—</span>
              <span class="engine-pv" id="engine-pv-2">未分析</span>
            </div>
          </div>

          <!-- 图表：默认局面走势，可切换用时 -->
          <div class="chart-card">
            <div class="chart-head">
              <span id="chart-title">局面走势</span>
              <button id="btn-chart-toggle" class="chart-toggle" type="button" title="切换为用时分析">⇄</button>
            </div>
            <div class="chart-body" id="chart-body">
              <svg class="chart-svg chart-line" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"></svg>
              <p class="chart-empty">该棋谱没有用时数据</p>
            </div>
          </div>

          <!-- 双方统计 -->
          <div class="stats-card">
            <section class="stats-side" data-side="white">
              <div class="stats-player">
                <span class="player-dot"></span>
                <span class="player-name" id="player-white">白方</span>
              </div>
              <div class="stats-row"><span class="mark mark-brilliant">!!</span><span class="mark-label">妙手</span><span class="stats-count" data-kind="brilliant">–</span></div>
              <div class="stats-row"><span class="mark mark-good">!</span><span class="mark-label">好棋</span><span class="stats-count" data-kind="good">–</span></div>
              <div class="stats-row"><span class="mark mark-best">★</span><span class="mark-label">最佳</span><span class="stats-count" data-kind="best">–</span></div>
              <div class="stats-row"><span class="mark mark-normal">·</span><span class="mark-label">一般</span><span class="stats-count" data-kind="normal">–</span></div>
              <div class="stats-row"><span class="mark mark-inaccuracy">?!</span><span class="mark-label">不精确</span><span class="stats-count" data-kind="inaccuracy">–</span></div>
              <div class="stats-row"><span class="mark mark-mistake">?</span><span class="mark-label">失误</span><span class="stats-count" data-kind="mistake">–</span></div>
              <div class="stats-row"><span class="mark mark-blunder">??</span><span class="mark-label">严重失误</span><span class="stats-count" data-kind="blunder">–</span></div>
              <div class="stats-accuracy"><span>准确度</span><span data-kind="accuracy">–</span></div>
              <div class="stats-accuracy"><span>ACPL</span><span data-kind="acpl">–</span></div>
            </section>
            <section class="stats-side" data-side="black">
              <div class="stats-player">
                <span class="player-dot black"></span>
                <span class="player-name" id="player-black">黑方</span>
              </div>
              <div class="stats-row"><span class="mark mark-brilliant">!!</span><span class="mark-label">妙手</span><span class="stats-count" data-kind="brilliant">–</span></div>
              <div class="stats-row"><span class="mark mark-good">!</span><span class="mark-label">好棋</span><span class="stats-count" data-kind="good">–</span></div>
              <div class="stats-row"><span class="mark mark-best">★</span><span class="mark-label">最佳</span><span class="stats-count" data-kind="best">–</span></div>
              <div class="stats-row"><span class="mark mark-normal">·</span><span class="mark-label">一般</span><span class="stats-count" data-kind="normal">–</span></div>
              <div class="stats-row"><span class="mark mark-inaccuracy">?!</span><span class="mark-label">不精确</span><span class="stats-count" data-kind="inaccuracy">–</span></div>
              <div class="stats-row"><span class="mark mark-mistake">?</span><span class="mark-label">失误</span><span class="stats-count" data-kind="mistake">–</span></div>
              <div class="stats-row"><span class="mark mark-blunder">??</span><span class="mark-label">严重失误</span><span class="stats-count" data-kind="blunder">–</span></div>
              <div class="stats-accuracy"><span>准确度</span><span data-kind="accuracy">–</span></div>
              <div class="stats-accuracy"><span>ACPL</span><span data-kind="acpl">–</span></div>
            </section>
          </div>

          <!-- 预留：AI 讲棋 -->
          <div class="ai-card"><span>AI 讲棋 · 开发中</span></div>
        </div>

        <!-- 未分析时的蒙版 -->
        <div class="analysis-mask" id="analysis-mask">
          <button class="btn primary" id="btn-analyze" type="button">分析本局</button>
          <p class="analysis-hint">引擎将在后续版本接入</p>
        </div>
      </div>
    </aside>

    <!-- 中间：棋盘 + 评估条 + 上下得子 -->
    <section class="board-stage">
      <div class="cap-strip" id="cap-top" aria-hidden="true"></div>
      <div class="board-with-eval">
        <div class="board-wrap" id="board-wrap"></div>
        <div class="evalbar" id="evalbar" aria-label="局面评估"></div>
      </div>
      <div class="cap-strip" id="cap-bottom" aria-hidden="true"></div>
    </section>

    <!-- 右侧：棋谱面板 -->
    <aside class="side side-right">
      <div class="panel movepanel">
        <div class="panel-head">棋谱</div>
        <div class="panel-tools">
          <input id="file-picker" type="file" accept=".pgn,.txt,application/x-chess-pgn" hidden />
          <button id="btn-import" class="btn" type="button" title="打开本机 PGN 文件，或粘贴 PGN 文本">导入棋谱</button>
          <button id="btn-export" class="btn" type="button" title="导出当前对局为 PGN 文件">导出 PGN</button>
          <button id="btn-engine-settings" class="btn" type="button" title="线程、内存、深度等引擎参数">引擎设置</button>
          <button id="btn-new-branch" class="btn" type="button" title="在当前位置新建一条支线，接着走一步即进入该支线">新建分支</button>
          <button id="btn-delete-branch" class="btn" type="button" title="删除当前所在的支线">删除分支</button>
          <button id="btn-display-settings" class="btn" type="button" title="评估条、箭头、标记等显示项">显示设置</button>
        </div>
        <div class="move-list" id="move-list"></div>
        <div class="ctlbar" id="ctlbar">
          <button id="btn-start" class="ctl" type="button" title="回到开局">⏮</button>
          <button id="btn-prev" class="ctl" type="button" title="上一步">◀</button>
          <button id="btn-flip" class="ctl" type="button" title="翻转棋盘">⟳</button>
          <button id="btn-next" class="ctl" type="button" title="下一步">▶</button>
          <button id="btn-end" class="ctl" type="button" title="跳到终局">⏭</button>
        </div>
      </div>
    </aside>
  </main>

  <script type="module" src="./src/pages/review.ts"></script>
</body>
</html>
