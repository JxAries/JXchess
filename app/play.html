<!DOCTYPE html>
<!-- 对弈页：先选人机/人人，再选时间限制；对局中显示双方时钟与得子。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对弈 · JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page play">
  <header class="topbar">
    <div class="brand">
      <img src="./logo.svg" alt="JXchess" width="30" height="30" />
      <span>JXchess</span>
    </div>
    <nav class="page-nav">
      <a class="nav-link" href="./index.html">首页</a>
      <a class="nav-link" href="./review.html">复盘</a>
      <a class="nav-link" href="./editor.html">摆棋</a>
      <a class="nav-link active" href="./play.html">对弈</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <main class="play-stage">
    <!-- 对弈方式 + 时间限制 -->
    <section class="play-card" id="setup">
      <h1>对弈</h1>
      <p>选择对弈方式与时间限制。</p>

      <div class="mode-options">
        <button class="mode-option selected" type="button" data-mode="engine">
          <strong>人机对弈</strong><span>与本地 Stockfish</span>
        </button>
        <button class="mode-option" type="button" data-mode="human">
          <strong>人人对弈</strong><span>同一台电脑轮流走</span>
        </button>
      </div>

      <div class="time-options">
        <button class="time-option" type="button" data-base="300000" data-inc="0">
          <strong>5+0</strong><span>5 分钟 · 无加秒</span>
        </button>
        <button class="time-option" type="button" data-base="600000" data-inc="0">
          <strong>10+0</strong><span>10 分钟 · 无加秒</span>
        </button>
        <button class="time-option" type="button" data-base="900000" data-inc="10000">
          <strong>15+10</strong><span>15 分钟 · 每步加 10 秒</span>
        </button>
      </div>
    </section>

    <!-- 对局中 -->
    <section class="game-layout" id="game" hidden>
      <div class="clock-row" id="clock-black-row">
        <span class="player-name" id="name-black">黑方</span>
        <span class="clock-caps" id="cap-black"></span>
        <span class="clock" id="clock-black">05:00</span>
      </div>

      <div class="board-wrap" id="play-board"></div>

      <div class="clock-row" id="clock-white-row">
        <span class="player-name" id="name-white">白方</span>
        <span class="clock-caps" id="cap-white"></span>
        <span class="clock" id="clock-white">05:00</span>
      </div>
    </section>

    <!-- 终局 -->
    <div class="result-mask" id="result" hidden>
      <div class="result-card">
        <h2 id="result-title">对局结束</h2>
        <p id="result-text"></p>
        <div class="row">
          <button class="btn" type="button" id="btn-again">再来一局</button>
          <button class="btn primary" type="button" id="btn-review">进入复盘分析</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./src/pages/play.ts"></script>
</body>
</html>
