<!DOCTYPE html>
<!-- 首页：logo 与标题居中，下方三张入口卡片（复盘 / 摆棋 / 对弈）；
     背景棋子由脚本随机生成并缓缓飘落，鼠标为棋子跟随效果。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JXchess</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="page home">
  <!-- 开屏动画：只在每次启动首次进入首页时播放，可点击跳过 -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-scene">
      <div class="splash-logo">
        <div class="splash-ink"><i></i><i></i><i></i></div>
        <div class="splash-logo-clip"><img src="./logo.svg" alt="" draggable="false" /></div>
        <div class="splash-brush"></div>
      </div>
      <div class="splash-word">JXCHESS</div>
      <div class="splash-progress"><span></span></div>
    </div>
  </div>

  <!-- 飘落的棋子背景由 home.ts 随机生成，纯装饰 -->
  <div class="sky" aria-hidden="true"></div>

  <main class="home-stage">
    <div class="home-entries">
      <a class="entry" href="./review.html">
        <img src="./pieces/wK.svg" alt="" width="46" height="46" draggable="false" />
        <span class="entry-name">复盘</span>
        <span class="entry-desc">导入棋谱，逐步回放</span>
      </a>

      <a class="entry" href="./editor.html">
        <img src="./pieces/wB.svg" alt="" width="46" height="46" draggable="false" />
        <span class="entry-name">摆棋</span>
        <span class="entry-desc">自由摆放，研究局面</span>
      </a>

      <a class="entry" href="./play.html">
        <img src="./pieces/wN.svg" alt="" width="46" height="46" draggable="false" />
        <span class="entry-name">对弈</span>
        <span class="entry-desc">与本地 Stockfish 对弈</span>
      </a>
    </div>
  </main>

  <script type="module" src="./src/pages/home.ts"></script>
</body>
</html>
